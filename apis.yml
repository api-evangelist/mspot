name: mSpot
description: 'mSpot was a mobile cloud-based content service provider founded in 2004 by Daren Tsui (CEO)
  and Ed Ho (CTO) and headquartered in Palo Alto, California. The company offered a cloud music locker
  that let users upload their music library and stream it from PCs, Macs, iPhone, iPad and Android devices,
  alongside a full-length movie rental service with content deals across Sony, Disney, Paramount, NBC/Universal,
  Lionsgate, Warner and others. mSpot raised roughly $2.3M in venture funding from Trinity Ventures and
  was acquired by Samsung Electronics in May 2012 (reported ~$8.8M) to power the Samsung Music Hub. The
  standalone mSpot product and brand were subsequently wound down and folded into Samsung; there is no
  active mSpot developer portal, API, or product surface today. This profile is retained as a historical
  network record.'
